[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrotwin-ml"
version = "0.1.0"
description = "Pipeline ML CorroTwin — prédiction risque corrosion aéronef"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "pydantic>=2.0",
  "lightgbm>=4.0; python_version < '3.14'",
]

[project.scripts]
corrotwin-train = "corrotwin_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
