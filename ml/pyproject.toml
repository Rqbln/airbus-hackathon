[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corrotwin-ml"
version = "0.1.0"
description = "Pipeline ML CorroTwin — prédiction du risque de corrosion (HAKS 2026)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.3"]

[tool.setuptools.packages.find]
where = ["src"]
